name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        # Manim needs Cairo and Pango headers; the pinned ManimPango/pycairo
        # versions resolve to wheels on these Python versions, but the headers
        # keep source builds working if a wheel is ever missing.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3-dev libcairo2-dev libpango1.0-dev pkg-config

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the workshop
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: python -m ruff check .

      - name: Static checks (names, docstrings, duplicates)
        run: python scripts/check_scenes.py

      - name: Execute every scene without writing video
        run: python scripts/check_scenes.py --dry-run --jobs 2

      - name: Tests (includes one real render and a notebook consistency check)
        run: python -m pytest -q
